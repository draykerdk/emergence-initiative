# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter

title: Emergence Initiative
description: Where papers, proposals and issues outside the core Drayker models are handled.

dk_kicker: Open edge
dk_subdomain: ei.drayker.org
dk_repo: https://github.com/draykerdk/emergence-initiative

defaults:
  - scope:
      path: ""
    values:
      layout: default
