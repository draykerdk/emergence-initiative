# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

# Set explicitly: GitHub Pages derives site.url without TLS when the certificate is
# terminated upstream, which leaves absolute URLs in meta tags on http. Everything the
# sitemap and the social cards emit has to be the canonical https address.
url: "https://ei.drayker.org"

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

title: "Emergence Initiative"
description: "An entry point for ideas whose place is still emerging. The Emergence Initiative receives questions, studies and proposals that do not yet fit an established component. It helps an unfamiliar contribution find the context in which it can be examined."

dk_kicker: "Open edge"
dk_subdomain: "ei.drayker.org"
dk_repo: "https://github.com/draykerdk/emergence-initiative"

defaults:
  - scope:
      path: ""
    values:
      layout: default

dk_sphere: "void"  # the permeable edge, before anything has a shape

# The official mark, recoloured. Geometry is fixed for every project
# (DRAYKER-MARK.md §2.5); only the globe carries the scope.
dk_accent: "#FF5500"
